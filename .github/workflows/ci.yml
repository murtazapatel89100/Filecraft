name: Filecraft CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-cli:
    name: Filecraft Python implementation (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            label: linux-amd64
          - runs_on: macos-latest
            label: macos-amd64
          - runs_on: windows-latest
            label: windows-amd64
    defaults:
      run:
        working-directory: filecraft-python
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev --sync

      - name: Lint (Black)
        run: poetry run black --check src tests

      - name: Run tests
        run: poetry run python -m unittest discover -s tests -p "test_*.py"

      - name: Build wheel/sdist
        run: poetry build

      - name: Build executable (PyInstaller)
        run: poetry run pyinstaller --onefile --name Filecraft-${{ matrix.label }}-python --paths src src/file_organiser_python/main.py

      - name: Upload Filecraft Python build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: filecraft-python-impl-build-${{ matrix.label }}
          path: filecraft-python/dist/*

